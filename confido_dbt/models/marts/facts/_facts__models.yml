version: 2

models:
  - name: fct_invoice_line_items
    description: >
      One row per invoice line, mapped from accounting-system remote IDs to
      Confido internal products, global customers and distribution centers.
      Unmapped lines are kept and flagged, never dropped.
    config:
      contract:
        enforced: true # column names and types are guaranteed to consumers

    data_tests:
      # Every source line appears exactly once: no fan-out, no dropped lines
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_accounting__invoice_items')

    columns:
      - name: invoice_line_item_id
        data_type: number(38,0)
        data_tests: [unique, not_null]
      - name: invoice_id
        data_type: number(38,0)
        data_tests: [not_null]
      - name: invoice_number
        data_type: varchar
      - name: paid_on_date
        data_type: date
      - name: company_detail_id
        data_type: number(38,0)
      - name: contact_id
        data_type: number(38,0)
      - name: global_customer_id
        data_type: number(38,0)
        data_tests:
          # Null is allowed (unmapped); non-null must exist in the customer dimension
          - relationships:
              arguments:
                to: ref('dim_customers') # ← was stg_confido__customers
                field: global_customer_id
      - name: distribution_center_id
        data_type: number(38,0)
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_distribution_centers') # ← was stg_confido__distribution_centers
                field: distribution_center_id
      - name: item_id
        data_type: number(38,0) # ← was number
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_items')
                field: item_id
      - name: product_id
        data_type: number(38,0)
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products') # ← was stg_confido__products
                field: product_id
      - name: line_type
        data_type: varchar
      - name: customer_remote_id
        data_type: varchar
      - name: item_remote_id
        data_type: varchar
      - name: currency_code
        data_type: varchar
      - name: amount_original
        data_type: number(18,2)
        data_tests: [not_null]
      - name: amount_usd
        data_type: number(18,2)
      - name: customer_map_status
        data_type: varchar
      - name: product_map_status
        data_type: varchar
      - name: dc_assignment
        data_type: varchar
      - name: is_credit
        data_type: boolean
      - name: is_test_invoice
        data_type: boolean
      - name: is_currency_defaulted
        data_type: boolean
      - name: is_fx_missing
        data_type: boolean
      - name: _source_updated_at
        data_type: timestamp_ntz
      - name: _dbt_loaded_at
        data_type: timestamp_ntz
